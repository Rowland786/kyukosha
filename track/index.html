<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="author" content="超工口级魔法少女">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>查询进度 · 旧校舍</title>
<meta name="description" content="凭案件编号和查询码查看举报走到了哪一步，按协助者的留言补充材料。">
<meta name="theme-color" content="#0a0a0b">
<meta name="robots" content="noindex">
<link rel="icon" href="/kyukosha/favicon.svg" type="image/svg+xml">
<script type="module" src="/src/js/track.js"></script>
</head>
<body class="page-track" data-no-smooth data-solid-head>
<include src="header.html" page="track"></include>

<main id="main" class="tk">
  <section class="tk__top">
    <svg class="tk__orbit" viewBox="0 0 900 360" fill="none" data-draw aria-hidden="true">
      <g stroke="rgba(235,232,225,.3)" stroke-width="0.8">
        <path d="M0 180H900" stroke-dasharray="4 6"/>
        <circle cx="110" cy="180" r="70"/><circle cx="250" cy="180" r="95"/><circle cx="420" cy="180" r="110"/><circle cx="600" cy="180" r="100"/><circle cx="770" cy="180" r="80"/>
      </g>
      <g fill="#ebe8e1" font-family="IBM Plex Mono, monospace" font-size="10">
        <circle cx="160" cy="130" r="3"/><text x="168" y="133">收件</text>
        <circle cx="312" cy="250" r="3"/><text x="320" y="253">核对</text>
        <circle cx="480" cy="88" r="3"/><text x="488" y="91">代投</text>
        <circle cx="670" cy="252" r="3"/><text x="678" y="255">官方处理</text>
        <circle cx="820" cy="120" r="3" fill="#f2c230"/><text x="828" y="123">回执</text>
      </g>
    </svg>
    <div class="wrap tk__head">
      <span class="kicker" data-reveal><span class="dot"></span><b>查询进度</b></span>
      <h1 class="tk__title" data-strip><span class="strip">走到哪一步了</span></h1>
      <p class="lede" data-reveal>输入提交时拿到的案件编号和查询码。查询码不要发给别人，拿到它的人就能看你的材料。</p>
    </div>
  </section>

  <div class="wrap tk__body">
    <form class="tk__login" id="login" novalidate>
      <label class="field"><span class="mono">案件编号</span><input class="input mono" name="id" placeholder="GK1030-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
      <label class="field"><span class="mono">查询码</span><input class="input mono" name="key" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
      <button class="btn btn--solid" type="submit"><span class="btn__t">查询</span><span class="btn__ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span></button>
      <div class="saved" id="saved"></div>
      <p class="err" id="loginErr" role="alert" hidden></p>
    </form>

    <section class="case" id="case" hidden aria-live="polite">
      <ol class="case__rail" id="rail" aria-label="进度">
        <li data-st="received"><b class="num">01</b>已收件</li>
        <li data-st="reviewing"><b class="num">02</b>核对中</li>
        <li data-st="ready"><b class="num">03</b>待代投</li>
        <li data-st="submitted"><b class="num">04</b>已代投</li>
        <li data-st="result"><b class="num">05</b>官方回复</li>
      </ol>
      <header class="case__head">
        <div>
          <span class="mono case__id" id="cId"></span>
          <h2 class="case__status" id="cStatus"></h2>
          <p class="case__desc" id="cDesc"></p>
        </div>
        <span class="stamp case__stamp" id="cStamp"></span>
      </header>
      <div class="notice notice--red case__request" id="cRequest" hidden></div>
      <div class="notice case__appeal" id="cAppeal" hidden></div>
      <div class="case__grid">
        <section>
          <h3 class="case__h mono">进度记录</h3>
          <ol class="tl" id="cEvents"></ol>
        </section>
        <section>
          <h3 class="case__h mono">你交的材料</h3>
          <dl class="rv" id="cSummary"></dl>
        </section>
      </div>

      <form class="form-card reply" id="reply" novalidate>
        <header class="fstep__head"><h3 class="h-2">补交视频或说明</h3></header>
        <p class="fhint">协助者要你补的材料，或者你想补充的说明，都在这里交。交完后状态会回到“核对中”。</p>
        <label class="field"><span>说明</span><textarea class="textarea" name="text" maxlength="3000" placeholder="例如：新视频 00:45 打开了 PLAYERLIST，能看到他的用户名。"></textarea></label>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择要上传的文件">
          <input type="file" id="fileInput" multiple accept="video/*,image/*,.mkv,.flv,.wmv" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
          <b>补传视频</b><span class="mono">单个不超过 200MB，不收 OBS 录屏</span>
        </div>
        <ul class="files" id="files"></ul>
        <div class="field"><span>补充链接</span><div class="link-rows" id="links"></div><button type="button" class="btn-line" id="addLink">＋ 再加一个链接</button></div>
        <p class="err" id="replyErr" role="alert" hidden></p>
        <div class="form-nav"><button class="btn btn--solid btn--sm" type="submit" id="replyBtn"><span class="btn__t">提交补充</span><span class="btn__ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span></button></div>
      </form>
    </section>
  </div>
</main>

<include src="footer.html"></include>
</body>
</html>
