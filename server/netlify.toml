[build]
  command = "echo no build step"
  publish = "public"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"

[dev]
  framework = "#static"
  publish = "public"
