<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学乱 Gakuran · 服饰图鉴</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#e3e6ea; --ink:#1d2126;
    --muted:#6d747e; --accent:#b3261e; --chip:#eef0f3;
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
  }
  .wrap{max-width:1280px; margin:0 auto; padding:0 20px}
  .head{display:flex; align-items:baseline; gap:12px; padding:15px 0 9px; flex-wrap:wrap}
  h1{font-size:19px; margin:0; letter-spacing:.2px}
  .sub{color:var(--muted); font-size:13px}
  .tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-bottom:10px}
  .lbl{font-size:12px; color:var(--muted); margin-right:-4px}
  .seg{display:flex; background:var(--chip); border-radius:9px; padding:3px}
  .seg button{
    border:0; background:transparent; padding:6px 13px; border-radius:7px; cursor:pointer;
    font-size:13px; color:#4a5058; font-family:inherit; white-space:nowrap;
  }
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); font-weight:600}
  input[type=search]{
    flex:1; min-width:150px; max-width:260px; border:1px solid var(--line); background:#fff;
    border-radius:9px; padding:8px 12px; font-size:13px; font-family:inherit; outline:none;
  }
  input[type=search]:focus{border-color:#b9bfc7}
  .cats{display:flex; flex-wrap:wrap; gap:6px; padding-bottom:10px}
  .cat{
    border:1px solid var(--line); background:#fff; border-radius:20px; padding:5px 12px;
    font-size:12.5px; cursor:pointer; color:#4a5058; font-family:inherit;
  }
  .cat.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .cat b{font-weight:600; opacity:.6; margin-left:4px; font-size:11.5px}
  .note{font-size:12px; color:#8a9099; padding:0 0 12px; line-height:1.6; display:none}
  .note.on{display:block}
  main{padding:20px 0 60px}
  .count{color:var(--muted); font-size:12.5px; margin-bottom:6px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px}
  .sect{grid-column:1/-1; display:flex; align-items:center; gap:10px; margin:26px 0 2px}
  .sect:first-child{margin-top:6px}
  .sect h2{font-size:14px; margin:0; font-weight:600; letter-spacing:.2px}
  .sect .n{font-size:12px; color:var(--muted)}
  .sect .line{flex:1; height:1px; background:var(--line)}
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:11px; overflow:hidden;
    cursor:zoom-in; transition:transform .16s ease, box-shadow .16s ease;
  }
  .item:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(20,25,35,.10)}
  .ph{position:relative; aspect-ratio:4/5; background:#eceef1; overflow:hidden}
  .ph img{width:100%; height:100%; object-fit:cover; display:block}
  .rb{
    position:absolute; top:7px; left:7px; font-size:10.5px; padding:2px 7px; border-radius:20px;
    background:rgba(20,22,26,.72); color:#fff; letter-spacing:.3px; backdrop-filter:blur(4px);
  }
  .meta{padding:8px 10px 10px}
  .nm{font-size:12.5px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .nm.none{color:#a3a9b2}
  .tag{font-size:11px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .empty{color:var(--muted); font-size:13px; padding:40px 0; text-align:center}
  .lb{
    position:fixed; inset:0; background:rgba(14,16,20,.84); z-index:60; display:none;
    align-items:center; justify-content:center; padding:28px; gap:26px;
  }
  .lb.on{display:flex}
  .lb figure{margin:0; max-width:min(60vw,720px); text-align:center}
  .lb img{max-width:100%; max-height:74vh; border-radius:10px; background:#fff; display:block; margin:0 auto}
  .lb figcaption{color:#e7e9ec; font-size:13px; margin-top:12px; line-height:1.6}
  .lb figcaption a{color:#ffb4ac}
  .lb .side{color:#cfd3d9; font-size:12.5px; line-height:1.9; max-width:230px}
  .lb .side div span{color:#8d949d; display:inline-block; min-width:62px}
  .lb .close{
    position:absolute; top:18px; right:22px; color:#fff; font-size:26px; cursor:pointer;
    line-height:1; opacity:.7; background:none; border:0;
  }
  .lb .close:hover{opacity:1}
  @media (max-width:720px){
    .lb{flex-direction:column; gap:14px}
    .lb figure{max-width:92vw}
    .lb .side{max-width:92vw}
    .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head">
      <h1>学乱 Gakuran · 服饰图鉴</h1>
      <span class="sub" id="sub"></span>
    </div>
    <div class="tools">
      <span class="lbl">性别</span>
      <div class="seg" id="genderSeg"></div>
      <span class="lbl">视角</span>
      <div class="seg" id="viewSeg"></div>
      <input type="search" id="q" placeholder="搜索名称 / 卡片…">
    </div>
    <div class="cats" id="cats"></div>
    <div class="note" id="note"></div>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
</main>
<div class="lb" id="lb">
  <button class="close" id="lbClose">×</button>
  <figure>
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
  <div class="side" id="lbSide"></div>
</div>

const GENDERS = ['全部','男性','女性','通用'];
const VIEWS = [
  {k:'category', t:'部位'},
  {k:'rarity',   t:'稀有度'},
  {k:'ethnicity',t:'种族'}
];
const CAT_ORDER = ['制服','发型','面部','头部饰品','颈部','手臂','腰部','背部','滑板','终结技'];
const RAR_ORDER = ['Legendary','Mythic','Epic','Rare','Uncommon','Common','Unique','???',''];
const ETH_ORDER = ['Japanese','European','African','Indian','MiddleEastern','Latino','Latina',''];
const ETH_CN = {Japanese:'日系',European:'欧美',African:'非洲',Indian:'印度',MiddleEastern:'中东',Latino:'拉美（男）',Latina:'拉美（女）'};

let state = {g:'全部', view:'category', f:'全部', q:''};
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function field(d){
  return state.view==='category' ? d.category
       : state.view==='rarity'   ? (d.rarity_base||'')
       : (d.ethnicity||'');
}
function label(v){
  if(v==='') return '未标注';
  if(state.view==='ethnicity') return ETH_CN[v] ? (ETH_CN[v]+' · '+v) : v;
  return v;
}
function orderOf(v){
  if(state.view==='category') return CAT_ORDER.indexOf(v);
  if(state.view==='rarity')   return RAR_ORDER.indexOf(v);
  return ETH_ORDER.indexOf(v);
}

function basePool(){
  // 性别范围内的全部条目
  return DATA.filter(d=> state.g==='全部' || d.gender===state.g);
}

function buildGender(){
  $('genderSeg').innerHTML = GENDERS.map(g=>{
    const n = g==='全部' ? DATA.length : DATA.filter(d=>d.gender===g).length;
    return `<button data-g="${g}" class="${g===state.g?'on':''}">${g} <b style="opacity:.5;font-weight:400">${n}</b></button>`;
  }).join('');
  $('genderSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.g=b.dataset.g; state.f='全部'; buildGender(); buildCats(); render();
  });
}

function buildView(){
  $('viewSeg').innerHTML = VIEWS.map(v=>
    `<button data-v="${v.k}" class="${v.k===state.view?'on':''}">${v.t}</button>`).join('');
  $('viewSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.view=b.dataset.v; state.f='全部'; buildView(); buildCats(); render();
  });
}

function buildCats(){
  const pool = basePool();
  const m = new Map();
  pool.forEach(d=>{ const k=field(d); m.set(k,(m.get(k)||0)+1); });
  const keys = [...m.keys()].sort((a,b)=>{
    const oa=orderOf(a), ob=orderOf(b);
    return (oa<0?999:oa)-(ob<0?999:ob);
  });
  let html = `<button class="cat ${state.f==='全部'?'on':''}" data-f="全部">全部 <b>${pool.length}</b></button>`;
  html += keys.map(k=>`<button class="cat ${state.f===k?'on':''}" data-f="${esc(k)}">${esc(label(k))} <b>${m.get(k)}</b></button>`).join('');
  $('cats').innerHTML = html;
  $('cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    state.f=b.dataset.f; buildCats(); render();
  });

  const note = $('note');
  if(state.view==='rarity'){
    const withR = pool.filter(d=>d.rarity_base).length;
    note.textContent = `看板正文只为制服 / 滑板 / 终结技标注了稀有度，共 ${withR} 件；其余 ${pool.length-withR} 件归入「未标注」。`;
    note.classList.add('on');
  } else if(state.view==='ethnicity'){
    const withE = pool.filter(d=>d.ethnicity).length;
    note.textContent = `种族信息来自发型目录页标题（日系 / 欧美 / 非洲 / 印度 / 中东 / 拉美），共 ${withE} 件；非发型类目没有种族数据。`;
    note.classList.add('on');
  } else {
    note.classList.remove('on');
  }
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return basePool().filter(d=>{
    if(state.view==='ethnicity' && !d.ethnicity) return false;
    if(state.f!=='全部' && field(d)!==state.f) return false;
    if(q){
      const hay = [d.name,d.category,d.rarity,d.ethnicity,d.card].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function card(d){
  const el = document.createElement('div');
  el.className='item';
  const nm = d.name ? esc(d.name) : '未命名';
  const badge = d.rarity_base ? `<span class="rb">${esc(d.rarity_base)}</span>` : '';
  const tag = [d.gender, state.view==='category' ? (d.ethnicity?ETH_CN[d.ethnicity]||d.ethnicity:'') : d.category,
               state.view!=='rarity' && d.rarity_base ? d.rarity_base : '']
              .filter(Boolean).join(' · ');
  el.innerHTML = `<div class="ph"><img loading="lazy" decoding="async" src="${encodeURI(d.file)}" alt="${nm}">${badge}</div>
    <div class="meta">
      <div class="nm ${d.name?'':'none'}">${nm}</div>
      <div class="tag">${esc(tag)}</div>
    </div>`;
  el.onclick=()=>openLb(d);
  return el;
}

function render(){
  const list = filtered();
  $('count').textContent = `显示 ${list.length} / ${DATA.length} 件`;
  const grid = $('grid');
  grid.innerHTML='';
  if(!list.length){ grid.innerHTML = '<div class="empty">没有匹配的条目</div>'; return; }

  const groups = new Map();
  list.forEach(d=>{
    const k = field(d);
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(d);
  });
  const keys = [...groups.keys()].sort((a,b)=>{
    const oa=orderOf(a), ob=orderOf(b);
    return (oa<0?999:oa)-(ob<0?999:ob);
  });

  const frag = document.createDocumentFragment();
  keys.forEach(k=>{
    const items = groups.get(k);
    const h = document.createElement('div');
    h.className='sect';
    h.innerHTML = `<h2>${esc(label(k))}</h2><span class="n">${items.length}</span><span class="line"></span>`;
    frag.appendChild(h);
    items.forEach(d=>frag.appendChild(card(d)));
  });
  grid.appendChild(frag);
}

function openLb(d){
  $('lbImg').src = encodeURI(d.file);
  $('lbCap').innerHTML = (d.name?esc(d.name):'未命名') +
    (d.card_url? ` · <a href="${esc(d.card_url)}" target="_blank" rel="noopener">Trello 卡片</a>`:'');
  const rows = [
    ['性别', d.gender], ['部位', d.category],
    ['种族', d.ethnicity ? (ETH_CN[d.ethnicity]||d.ethnicity) : '—'],
    ['稀有度', d.rarity || '—'],
    ['资产ID', d.asset_id||'—'],
    ['来源', d.source + (d.sheet? '（'+d.sheet+'）':'')],
    ['卡片', d.card||'—'], ['文件', d.file],
  ];
  $('lbSide').innerHTML = rows.map(([k,v])=>`<div><span>${k}</span>${esc(v)}</div>`).join('');
  $('lb').classList.add('on');
}

$('lbClose').onclick = ()=>$('lb').classList.remove('on');
$('lb').onclick = e => { if(e.target.id==='lb') $('lb').classList.remove('on'); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('lb').classList.remove('on'); });
$('q').oninput = e => { state.q = e.target.value; render(); };

$('sub').textContent = `共 ${DATA.length} 件 · 来源 Trello「(学乱) Gakuran Trello」`;
buildGender(); buildView(); buildCats(); render();
</script>
</body>
</html>
