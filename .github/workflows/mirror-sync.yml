# 每周检查 Kaglorn/gakuran-clothes 是否有更新；有变化就同步进 public/mirror 并提交。
# 旧文件仍保留在 git 历史里。
name: Mirror sync

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 同步并逐文件校验
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/mirror/sync.mjs
      - name: 有变化时提交
        run: |
          git config user.name "kyukosha-mirror"
          git config user.email "kyukosha-mirror@users.noreply.github.com"
          git add public/mirror
          if git diff --cached --quiet -- public/mirror ':!public/mirror/manifest.json'; then
            echo "上游没有变化"
          else
            git commit -m "镜像同步：Kaglorn/gakuran-clothes $(node -p "require('./public/mirror/manifest.json').source.commit.slice(0,7)")"
            git push
          fi
